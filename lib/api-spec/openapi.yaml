openapi: 3.1.0

info:
  title: Api
  version: 0.1.0
  description: API specification

servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: orders
    description: Order operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Get product by slug
      description: Returns an active Nexora product by slug
      parameters:
        - name: slug
          in: path
          required: true
          description: Product slug
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create order
      description: Creates a guest order using current product prices and stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient stock or unavailable product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Get products
      description: Returns all active Nexora products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateOrderItem:
      type: object
      properties:
        productId:
          type: number
        quantity:
          type: number
          minimum: 1
      required:
        - productId
        - quantity

    CreateOrderRequest:
      type: object
      properties:
        customerName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          nullable: true
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        pincode:
          type: string
          minLength: 1
        paymentMethod:
          type: string
        notes:
          type: string
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderItem"
      required:
        - customerName
        - phone
        - address
        - city
        - pincode
        - paymentMethod
        - items

    CreateOrderResponse:
      type: object
      properties:
        orderId:
          type: number
        total:
          type: string
        paymentStatus:
          type: string
        orderStatus:
          type: string
      required:
        - orderId
        - total
        - paymentStatus
        - orderStatus

    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Product:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
        compareAtPrice:
          type: string
          nullable: true
        category:
          type: string
        stock:
          type: number
        images:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - price
        - category
        - stock
        - images
        - isActive
        - createdAt
        - updatedAt
